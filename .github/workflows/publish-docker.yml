name: Publish Docker image

# Publishes only the node and UI pair that Validate wrapper tested: the pins in
# validate.yml at a wrapper commit on main whose validation passed with every
# check (pushes to main never skip the heavy checks). See docs/DOCKER_IMAGE.md.
on:
  workflow_run:
    workflows:
      - Validate wrapper
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write
  packages: write

# Queue instead of cancelling: an older run must never cancel a newer publish.
# An older run that starts later fails the main-tip check below.
concurrency:
  group: publish-docker
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    # Dependabot pushes skip the image and browser checks in validate.yml.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.actor.login != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out validated image project
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve validated sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_WRAPPER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${VALIDATED_WRAPPER_SHA}"
          # A tag named main, or a re-run of an older main run, must not publish.
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "${main_sha}" != "${VALIDATED_WRAPPER_SHA}" ]]; then
            echo "::error::Validated commit ${VALIDATED_WRAPPER_SHA} is not the tip of main (${main_sha}); refusing to publish."
            exit 1
          fi
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"
          node scripts/publish-sources.mjs --wrapper "${VALIDATED_WRAPPER_SHA}" >> "${GITHUB_ENV}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          # Under workflow_run, the generated commit tag and revision label would
          # name the default-branch head, not the validated wrapper commit.
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=raw,value=sha-${{ env.WRAPPER_SHORT_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.WRAPPER_SHA }}
            org.opencontainers.image.version=main

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PIGEON_SWARM_NODE_SHA=${{ env.PIGEON_SWARM_NODE_SHA }}
            PIGEON_SWARM_UI_SHA=${{ env.PIGEON_SWARM_UI_SHA }}
            VITE_API_SERVER_URL=/api
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          secrets: |
            github_token=${{ secrets.SOURCE_REPOSITORIES_TOKEN }}
