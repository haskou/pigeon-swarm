name: Validate wrapper

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-wrapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Docker wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Check out image project
        uses: actions/checkout@v7

      - name: Validate Docker Compose example
        run: docker compose --env-file /dev/null config

      - name: Guard simple runtime contract
        run: |
          forbidden_transport="in-""memory"

          if grep -R "${forbidden_transport}" . --exclude-dir=.git; then
            echo "Do not document or default to the forbidden single-node transport in this wrapper."
            exit 1
          fi

          if grep -E "^(HOST_PORT|API_PORT|ROUTE_PREFIX|MONGO_URL|MONGO_DATABASE|TRANSPORT_DSN)=" .env.example; then
            echo ".env.example should expose PORT only; keep image internals out of user config."
            exit 1
          fi

          if ! grep -F 'CALLS_TURN_SHARED_SECRET: ${CALLS_TURN_SHARED_SECRET:-}' docker-compose.yml; then
            echo "The backend must receive the optional TURN secret override."
            exit 1
          fi

          if ! grep -F 'CALLS_TURN_SHARED_SECRET: ${CALLS_TURN_SHARED_SECRET:-Kestrel7-Quartz9-Pigeon4-Nebula8-Harbor2-Cipher6-Orbit5-Velvet3}' docker-compose.yml; then
            echo "Coturn must use the backend built-in shared secret by default."
            exit 1
          fi

          if ! grep -F "readonly default_shared_secret='Kestrel7-Quartz9-Pigeon4-Nebula8-Harbor2-Cipher6-Orbit5-Velvet3'" scripts/run-turn-from-runtime-config.sh; then
            echo "The coturn runtime fallback must match the Compose fallback."
            exit 1
          fi

          if grep -E '^(CALLS_ICE_TRANSPORT_POLICY|CALLS_TURN_PORT|CALLS_TURN_RELAY_MIN_PORT|CALLS_TURN_RELAY_MAX_PORT)=' .env.example; then
            echo "TURN policy and ports must come from persisted node configuration."
            exit 1
          fi

      - name: Check documented environment variables
        run: |
          node <<'NODE'
          const fs = require('fs');

          const envNames = fs.readFileSync('.env.example', 'utf8')
            .split(/\r?\n/)
            .map((line) => line.match(/^([A-Z0-9_]+)=/)?.[1])
            .filter(Boolean);

          const documentedNames = [...fs.readFileSync('docs/DOCKER_IMAGE.md', 'utf8')
            .matchAll(/\| `([A-Z0-9_]+)` \|/g)]
            .map((match) => match[1]);

          const missing = envNames.filter((name) => !documentedNames.includes(name));

          if (missing.length > 0) {
            console.error(`Missing from docs/DOCKER_IMAGE.md: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Verify authenticated TURN allocation
        run: |
          docker compose --env-file /dev/null up -d --wait app turn
          docker compose --env-file /dev/null exec -T app \
            chown 1000:1000 /run/pigeon
          docker compose --env-file /dev/null exec -T -u 1000:1000 app sh -lc \
            'printf "version=1\nenabled=true\nlistening_port=4101\nrelay_port_start=4102\nrelay_port_end=4105\n" > /run/pigeon/calls-turn-runtime.conf'
          ./scripts/verify-turn.sh

      - name: Stop TURN test service
        if: always()
        run: docker compose --env-file /dev/null down
