# WebRTC uses UDP relay allocations even when its TURN connection is TCP/TLS.
no-tcp-relay
no-cli
# Block destinations reachable from the relay's private network by default.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# Do not start this range at ::: coturn treats an all-zero lower bound as
# unbounded across address families. Its built-in zero-address check rejects ::.
denied-peer-ip=::1-::ffff:ffff
# Coturn compares IPv6 range bytes component by component; cover compatible
# addresses ending in zero without using an all-zero/unbounded lower endpoint.
denied-peer-ip=::100-::ffff:ffff
denied-peer-ip=::1:0-::ffff:ffff
denied-peer-ip=::100:0-::ffff:ffff
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=64:ff9b:1::-64:ff9b:1:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fec0::-feff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=ff00::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
