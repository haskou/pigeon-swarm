name: Publish independent client

on:
  workflow_dispatch:
    inputs:
      ui_sha:
        description: Reviewed full 40-character commit from haskou/pigeon-swarm-ui.
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-client-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and attest independent client
    runs-on: ubuntu-latest
    steps:
      - name: Check out image project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate immutable source input
        shell: bash
        env:
          UI_SHA_INPUT: ${{ inputs.ui_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$UI_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'ui_sha must be a full lowercase 40-character commit SHA' >&2
            exit 1
          fi
          {
            echo "UI_SHA=$UI_SHA_INPUT"
            echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}-client"
            echo "CLIENT_VERSION=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Check out exact reviewed UI commit
        uses: actions/checkout@v7
        with:
          repository: haskou/pigeon-swarm-ui
          ref: ${{ env.UI_SHA }}
          path: ui-source
          token: ${{ secrets.SOURCE_REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false

      - name: Prepare exact tracked UI build context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C ui-source rev-parse HEAD)" = "$UI_SHA"
          mkdir -p "$RUNNER_TEMP/client-ui"
          git -C ui-source archive "$UI_SHA" | tar -x -C "$RUNNER_TEMP/client-ui"

      - name: Validate static client origin
        run: node --test tests/client-server.test.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build selected client for release validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          target: production
          build-contexts: |
            ui=${{ runner.temp }}/client-ui
          platforms: linux/amd64
          load: true
          push: false
          tags: pigeon-client-validation:${{ github.run_id }}
          build-args: |
            PIGEON_SWARM_UI_SHA=${{ env.UI_SHA }}
            PIGEON_SWARM_WRAPPER_SHA=${{ github.sha }}
          cache-from: type=gha,scope=independent-client
          cache-to: type=gha,mode=max,scope=independent-client

      - name: Validate the selected image in a browser before publishing
        shell: bash
        run: |
          set -euo pipefail
          CLIENT_CONTAINER="$(docker create "pigeon-client-validation:$GITHUB_RUN_ID")"
          trap 'docker rm "$CLIENT_CONTAINER" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/client-dist"
          docker cp "$CLIENT_CONTAINER:/app/public/." "$RUNNER_TEMP/client-dist"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          PIGEON_CLIENT_DIST="$RUNNER_TEMP/client-dist" node --test tests/independent-client-browser.integration.mjs

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable client release
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.client
          target: production
          build-contexts: |
            ui=${{ runner.temp }}/client-ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.CLIENT_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.CLIENT_VERSION }}
            io.pigeon.client.wrapper-revision=${{ github.sha }}
            io.pigeon.client.ui-revision=${{ env.UI_SHA }}
          build-args: |
            PIGEON_SWARM_UI_SHA=${{ env.UI_SHA }}
            PIGEON_SWARM_WRAPPER_SHA=${{ github.sha }}
          cache-from: type=gha,scope=independent-client
          cache-to: type=gha,mode=max,scope=independent-client
          provenance: mode=max
          sbom: true

      - name: Attest client image digest
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record release source and build metadata
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';
          const env = process.env;
          const metadata = {
            contractVersion: 1,
            version: env.CLIENT_VERSION,
            image: `${env.IMAGE_NAME}@${env.IMAGE_DIGEST}`,
            uiRepository: 'https://github.com/haskou/pigeon-swarm-ui',
            uiCommit: env.UI_SHA,
            wrapperRepository: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}`,
            wrapperCommit: env.GITHUB_SHA,
            workflow: '.github/workflows/publish-client.yml',
            run: `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`,
            runAttempt: Number(env.GITHUB_RUN_ATTEMPT),
          };
          writeFileSync('independent-client-build.json', JSON.stringify(metadata, null, 2) + '\n');
          appendFileSync(env.GITHUB_STEP_SUMMARY, `Client release: \`${metadata.image}\`\n\nVersion: ${metadata.version}\n\nUI commit: ${metadata.uiCommit}\n\nWrapper commit: ${metadata.wrapperCommit}\n`);
          NODE

      - name: Attest release metadata
        uses: actions/attest@v4
        with:
          subject-path: independent-client-build.json

      - name: Save release metadata
        uses: actions/upload-artifact@v7
        with:
          name: independent-client-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: independent-client-build.json
          if-no-files-found: error
