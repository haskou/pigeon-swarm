name: Validate wrapper

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIGEON_SWARM_NODE_SHA: 7c2aa2dc1a9cef049b156de4b7632b2d813afdc6
  PIGEON_SWARM_UI_SHA: 24628b76241fe2c2821823f71c01aca197f1c145

concurrency:
  group: validate-wrapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only changes skip the heavy steps and jobs; light checks always
  # run. Skipped steps keep their names, so required checks still report.
  # See .github/actions/classify-changes.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Check out image project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changes
        id: classify
        uses: ./.github/actions/classify-changes

  validate:
    name: Validate Docker wrapper
    needs: changes
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check out image project
        uses: actions/checkout@v7

      - name: Validate TURN secret and Compose contract
        run: node --test tests/turn-secret.test.mjs tests/automatic-turn-secret.test.mjs tests/turn-allocation-probe.test.mjs tests/bundled-runtime.test.mjs

      - name: Verify startup files are included in the Docker build context
        run: |
          docker build -f - . <<'DOCKERFILE'
          FROM scratch
          COPY docker-entrypoint.sh /docker-entrypoint.sh
          COPY scripts/prepare-turn-secret.cjs /prepare-turn-secret.cjs
          DOCKERFILE

      - name: Validate independent static client origin
        run: node --test tests/client-server.test.mjs

      - name: Guard simple runtime contract
        run: |
          forbidden_transport="in-""memory"

          if grep -R "${forbidden_transport}" . --exclude-dir=.git; then
            echo "Do not document or default to the forbidden single-node transport in this wrapper."
            exit 1
          fi

          if grep -E "^(HOST_PORT|API_PORT|ROUTE_PREFIX|MONGO_URL|MONGO_DATABASE|TRANSPORT_DSN)=" .env.example; then
            echo ".env.example should expose PORT only; keep image internals out of user config."
            exit 1
          fi

          if grep -E '^(CALLS_ICE_TRANSPORT_POLICY|CALLS_TURN_PORT|CALLS_TURN_RELAY_MIN_PORT|CALLS_TURN_RELAY_MAX_PORT)=' .env.example; then
            echo "TURN policy and ports must come from persisted node configuration."
            exit 1
          fi

      - name: Check documented environment variables
        run: |
          node <<'NODE'
          const fs = require('fs');

          const envNames = fs.readFileSync('.env.example', 'utf8')
            .split(/\r?\n/)
            .map((line) => line.match(/^([A-Z0-9_]+)=/)?.[1])
            .filter(Boolean);

          const documentedNames = [...fs.readFileSync('docs/DOCKER_IMAGE.md', 'utf8')
            .matchAll(/\| `([A-Z0-9_]+)` \|/g)]
            .map((match) => match[1]);

          const missing = envNames.filter((name) => !documentedNames.includes(name));

          if (missing.length > 0) {
            console.error(`Missing from docs/DOCKER_IMAGE.md: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Validate release verification matrix
        run: node --test tests/release-verification.test.mjs

      - name: Verify TURN authentication and restart against real coturn
        if: needs.changes.outputs.heavy != 'false'
        run: node --test tests/turn-runtime.integration.mjs

      - name: Install browser test tooling
        if: needs.changes.outputs.heavy != 'false'
        run: npm ci --ignore-scripts

      - name: Validate private delivery contracts
        if: needs.changes.outputs.heavy != 'false'
        run: npm run test:privacy

      - name: Validate storage benchmark budgets and cleanup
        run: node --test benchmarks/private-storage/*.test.mjs

      - name: Validate canary scan encodings
        run: node --test tests/canary-scan.test.mjs

      - name: Validate restore copy helper
        run: node --test tests/restore-copy.test.mjs

      - name: Validate relay fault link drop
        run: node --test tests/relay-connection-drop.test.mjs

      - name: Validate pin bump helper
        run: node --test tests/bump-pins.test.mjs

      - name: Verify browser diagnostic redaction
        if: needs.changes.outputs.heavy != 'false'
        run: node --test tests/turn-browser-probe.test.mjs

      - name: Build immutable application image from pinned sources
        if: needs.changes.outputs.heavy != 'false' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SOURCE_REPOSITORIES_TOKEN: ${{ secrets.SOURCE_REPOSITORIES_TOKEN || github.token }}
        run: |
          docker build --target production \
            --secret id=github_token,env=SOURCE_REPOSITORIES_TOKEN \
            --build-arg PIGEON_SWARM_NODE_SHA="$PIGEON_SWARM_NODE_SHA" \
            --build-arg PIGEON_SWARM_UI_SHA="$PIGEON_SWARM_UI_SHA" \
            --iidfile "$RUNNER_TEMP/pigeon-test-image.id" .
          printf 'PIGEON_TEST_IMAGE=%s\n' "$(cat "$RUNNER_TEMP/pigeon-test-image.id")" >> "$GITHUB_ENV"

      - name: Verify backend-issued credentials and bidirectional browser audio
        if: needs.changes.outputs.heavy != 'false' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: npm run test:media

      - name: Verify automatic relay discovery and recovery
        if: needs.changes.outputs.heavy != 'false' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: npm run test:relay

      - name: Verify moderation and publishing limits on a real node
        if: needs.changes.outputs.heavy != 'false' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: npm run test:moderation

      - name: Verify application workflows between independent nodes
        if: needs.changes.outputs.heavy != 'false' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          node --test tests/turn-entrypoint.integration.mjs
          npm run test:e2e

      - name: Verify application calls across two NAT routers
        if: needs.changes.outputs.heavy != 'false' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: npm run test:e2e:nat

  independent-client:
    name: Validate independent client
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out image project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out supported client source
        uses: actions/checkout@v7
        with:
          repository: haskou/pigeon-swarm-ui
          ref: ${{ env.PIGEON_SWARM_UI_SHA }}
          path: client-source
          token: ${{ secrets.SOURCE_REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build independent client
        working-directory: client-source
        run: |
          yarn install --frozen-lockfile
          VITE_INDEPENDENT_CLIENT=true yarn build

      - name: Install browser test tooling
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify browser trust boundary and update rollback
        run: |
          export PIGEON_CLIENT_DIST="$GITHUB_WORKSPACE/client-source/dist"
          node --test tests/independent-client-browser.integration.mjs

      - name: Build immutable application image from pinned sources
        env:
          SOURCE_REPOSITORIES_TOKEN: ${{ secrets.SOURCE_REPOSITORIES_TOKEN || github.token }}
        run: |
          docker build --target production \
            --secret id=github_token,env=SOURCE_REPOSITORIES_TOKEN \
            --build-arg PIGEON_SWARM_NODE_SHA="$PIGEON_SWARM_NODE_SHA" \
            --build-arg PIGEON_SWARM_UI_SHA="$PIGEON_SWARM_UI_SHA" \
            --iidfile "$RUNNER_TEMP/pigeon-test-image.id" .
          printf 'PIGEON_TEST_IMAGE=%s\n' "$(cat "$RUNNER_TEMP/pigeon-test-image.id")" >> "$GITHUB_ENV"

      - name: Verify independent client calls against real nodes
        run: |
          export PIGEON_CLIENT_DIST="$GITHUB_WORKSPACE/client-source/dist"
          export PIGEON_INDEPENDENT_CLIENT=true
          npm run test:e2e

      - name: Build independent client with mailbox availability servers
        working-directory: client-source
        run: |
          VITE_INDEPENDENT_CLIENT=true \
            VITE_MAILBOX_AVAILABILITY_SERVERS=https://localhost:8443/api,https://localhost:8444/api \
            yarn build --outDir "$RUNNER_TEMP/availability-client-dist"

      - name: Verify direct inbox availability across nodes
        run: |
          export PIGEON_AVAILABILITY_CLIENT_DIST="$RUNNER_TEMP/availability-client-dist"
          npm run test:e2e:availability

  ui-e2e:
    name: Validate UI against a real node
    needs: changes
    if: always() && needs.changes.outputs.heavy != 'false' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out image project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out supported client source
        uses: actions/checkout@v7
        with:
          repository: haskou/pigeon-swarm-ui
          ref: ${{ env.PIGEON_SWARM_UI_SHA }}
          path: client-source
          token: ${{ secrets.SOURCE_REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install client test tooling
        working-directory: client-source
        run: |
          yarn install --frozen-lockfile
          yarn playwright install --with-deps chromium firefox

      - name: Build immutable application image from pinned sources
        env:
          SOURCE_REPOSITORIES_TOKEN: ${{ secrets.SOURCE_REPOSITORIES_TOKEN || github.token }}
        run: |
          docker build --target production \
            --secret id=github_token,env=SOURCE_REPOSITORIES_TOKEN \
            --build-arg PIGEON_SWARM_NODE_SHA="$PIGEON_SWARM_NODE_SHA" \
            --build-arg PIGEON_SWARM_UI_SHA="$PIGEON_SWARM_UI_SHA" \
            --iidfile "$RUNNER_TEMP/pigeon-test-image.id" .
          printf 'PIGEON_TEST_IMAGE=%s\n' "$(cat "$RUNNER_TEMP/pigeon-test-image.id")" >> "$GITHUB_ENV"

      - name: Verify UI flows against the real node in the image
        run: |
          export PIGEON_UI_SOURCE="$GITHUB_WORKSPACE/client-source"
          npm run test:ui-e2e
