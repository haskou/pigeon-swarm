# Isolated authentication test: no application databases or host ports.
services:
  app:
    image: node:24.15-alpine
    entrypoint: ["sh", "-c", "chown 1000:1000 /run/pigeon && exec su node -s /bin/sh -c \"node /opt/pigeon/scripts/prepare-turn-secret.cjs /run/pigeon/persisted-secret /run/pigeon/turn-shared-secret && exec node -e 'setInterval(() => {}, 60000)'\""]
    healthcheck:
      test: ["CMD", "test", "-s", "/run/pigeon/turn-shared-secret"]
      interval: 1s
      retries: 30
    ports: !reset []
    volumes: !override
      - turn_runtime:/run/pigeon
      - ./scripts:/opt/pigeon/scripts:ro
      - ./tests:/opt/pigeon/tests:ro
  turn:
    volumes:
      # Local fixture address; this test does not exercise public IP detection.
      - ./tests/detect-local-turn-ip.sh:/usr/local/bin/detect-external-ip:ro
networks:
  default:
    enable_ipv6: true
