services:
  app:
    image: ghcr.io/haskou/pigeon-swarm:latest
    pull_policy: always
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - KILL
      - SETGID
      - SETUID
    environment:
      CALLS_TURN_SHARED_SECRET: ${CALLS_TURN_SHARED_SECRET:?Configure a private TURN secret in .env before starting the stack}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LINK_PREVIEW_RATE_LIMIT_PER_MINUTE: ${LINK_PREVIEW_RATE_LIMIT_PER_MINUTE:-30}
      PIGEON_RELAY_DATA_LIMIT_BYTES: ${PIGEON_RELAY_DATA_LIMIT_BYTES:-67108864}
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
      PUSH_VAPID_SUBJECT: ${PUSH_VAPID_SUBJECT:-}
    volumes:
      - ${IPFS_STORAGE_HOST_PATH:-./ipfs_storage}:/data/ipfs
      - ${LOCAL_STORAGE_HOST_PATH:-./local_storage}:/data/local_storage
      - turn_runtime:/run/pigeon
    ports:
      - "${PORT:-8080}:8080"
      # Private relay nodes must also publish the relay ports configured during
      # node startup. Reserve at least one TCP port per private network this
      # node will relay, for example:
      # - "4100-4199:4100-4199/tcp"
      # TURN reuses the configured private relay range over UDP:
      # - "4100-4199:4100-4199/udp"
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  turn:
    image: coturn/coturn:4.11.0-r0-alpine
    depends_on:
      app:
        condition: service_started
    network_mode: service:app
    entrypoint:
      - /bin/sh
      - /opt/pigeon/run-turn-from-runtime-config.sh
    command:
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --realm=pigeon-swarm
      - --pidfile=/tmp/turnserver.pid
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --stale-nonce=600
    environment:
      CALLS_TURN_SHARED_SECRET: ${CALLS_TURN_SHARED_SECRET:?Configure a private TURN secret in .env before starting the stack}
    volumes:
      - ./scripts/check-turn-runtime.sh:/opt/pigeon/check-turn-runtime.sh:ro
      - ./scripts/run-turn-from-runtime-config.sh:/opt/pigeon/run-turn-from-runtime-config.sh:ro
      - turn_runtime:/run/pigeon:ro
    tmpfs:
      - /run/pigeon-turn:mode=0700,uid=65534,gid=65533
    healthcheck:
      test:
        - CMD
        - /opt/pigeon/check-turn-runtime.sh
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  turn_runtime:
